<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AgrarPlan Pro</title>

  <!-- FullCalendar -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css">

  <style>
    :root{
      --bg:#f4f6f5; --card:#fff; --side:#163526; --side2:#24533b; --txt:#0d1b12;
      --muted: rgba(0,0,0,.65);
    }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family: Arial, system-ui; background:var(--bg); color:var(--txt); height:100vh; display:flex; }
    .sidebar{ width:260px; background:var(--side); color:#fff; padding:16px; }
    .sidebar h1{ font-size:18px; margin:0 0 8px; }
    .sidebar small{ opacity:.85; display:block; margin-bottom:10px; }
    .navbtn{
      width:100%; padding:10px 12px; border:0; border-radius:12px;
      background:var(--side2); color:#fff; cursor:pointer; margin-top:8px; text-align:left;
    }
    .navbtn:hover{ filter:brightness(1.08); }
    .content{ flex:1; padding:18px; overflow:auto; }
    .topbar{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
    .topbar input{ flex:1; min-width:240px; }
    section{ background:var(--card); border-radius:14px; padding:14px; box-shadow:0 2px 10px rgba(0,0,0,.05); }
    section.hide{ display:none; }
    h2{ margin:0 0 10px; font-size:18px; }
    .row{ display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start; }
    .card{ background:#fff; border-radius:14px; padding:14px; box-shadow:0 2px 10px rgba(0,0,0,.05); }
    input, select, textarea{
      width:100%; padding:10px; border-radius:12px; border:1px solid #d8e0db; margin:6px 0;
    }
    textarea{ min-height:90px; resize:vertical; }
    .task{ border-left:6px solid #2c7a4b; padding:10px; border-radius:12px; background:#fbfcfb; margin-top:10px; }
    .task.done{ opacity:.65; text-decoration:line-through; }
    .meta{ font-size:13px; color:var(--muted); margin-top:6px; white-space:pre-wrap; }
    .task button{ padding:8px 10px; border:0; border-radius:10px; cursor:pointer; margin-right:8px; }
    .ok{ background:#dff3e7; }
    .del{ background:#ffe2e2; }
    #cal{ background:#fff; border-radius:14px; padding:10px; }
  </style>
</head>

<body>
  <div class="sidebar">
    <h1>🌾 AgrarPlan Pro</h1>
    <small>Aufträge • Kalender • Live-Sync</small>

    <button class="navbtn" onclick="showView('tasks')">📋 Aufträge</button>
    <button class="navbtn" onclick="showView('calendar')">📅 Kalender</button>
  </div>

  <div class="content">
    <div class="topbar">
      <input id="farmId" placeholder="Betriebscode (z.B. HOF-01)" />
      <button class="navbtn" style="width:auto" onclick="applyFarm()">✅ Laden</button>
      <button class="navbtn" style="width:auto" onclick="copyShareLink()">🔗 Link teilen</button>
    </div>

    <section id="view-tasks">
      <h2>📋 Aufträge</h2>
      <div class="row">
        <div class="card" style="flex:1; min-width:260px;">
          <h2>➕ Neuer Auftrag</h2>
          <input id="tTitle" placeholder="Titel (z.B. Stall ausmisten)" />
          <input type="date" id="tDate" />
          <input id="tWorker" placeholder="Person/Team (frei eingeben)" />
          <input id="tPlace" placeholder="Ort (z.B. Stall / Feld 3 / Lager)" />
          <select id="tPrio">
            <option value="normal">Priorität: Normal</option>
            <option value="hoch">Priorität: Hoch</option>
            <option value="niedrig">Priorität: Niedrig</option>
          </select>
          <textarea id="tInfo" placeholder="Weitere Infos…"></textarea>
          <button class="navbtn" onclick="createTask()">Speichern</button>
          <div class="meta">
            Tipp: Nur Aufträge mit Datum erscheinen im Kalender.
          </div>
        </div>

        <div class="card" style="flex:2; min-width:300px;">
          <h2>📌 Liste</h2>
          <div id="taskList"></div>
        </div>
      </div>
    </section>

    <section id="view-calendar" class="hide">
      <h2>📅 Kalender</h2>
      <div id="cal"></div>
      <div class="meta">
        Alle Aufträge mit Datum werden automatisch angezeigt. Klick auf einen Eintrag zeigt Details.
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      initializeFirestore, collection, doc, addDoc, deleteDoc, updateDoc,
      onSnapshot, query, orderBy, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const $ = (id) => document.getElementById(id);

    const firebaseConfig = {
      apiKey: "AIzaSyA7FgCpiflkQpnYcSuTh1q2aXpTfZXQ5vo",
      authDomain: "agrarplanpro.firebaseapp.com",
      projectId: "agrarplanpro",
      storageBucket: "agrarplanpro.firebasestorage.app",
      messagingSenderId: "793787909192",
      appId: "1:793787909192:web:fac554aae83ba8431b847d"
    };

    const app = initializeApp(firebaseConfig);

    // Robust (Schulnetz etc.)
    const db = initializeFirestore(app, {
      experimentalForceLongPolling: true,
      useFetchStreams: false
    });

    // Navigation
    window.showView = (name) => {
      $("view-tasks").classList.toggle("hide", name !== "tasks");
      $("view-calendar").classList.toggle("hide", name !== "calendar");
      if (name === "calendar" && calendar) setTimeout(() => calendar.updateSize(), 100);
    };

    // Farm Handling
    let FARM = "";
    function getFarmFromUrlOrStorage(){
      const url = new URL(window.location.href);
      return (url.searchParams.get("farm") || localStorage.getItem("farmId") || "").trim();
    }
    function setFarmToUrl(farm){
      const url = new URL(window.location.href);
      url.searchParams.set("farm", farm);
      history.replaceState({}, "", url.toString());
    }

    window.applyFarm = () => {
      const f = ($("farmId").value || "").trim();
      if (!f) return alert("Bitte Betriebscode eingeben.");
      FARM = f;
      localStorage.setItem("farmId", FARM);
      setFarmToUrl(FARM);
      startListeners();
      alert("Betriebscode geladen: " + FARM);
    };

    window.copyShareLink = async () => {
      if (!FARM) return alert("Erst Betriebscode laden.");
      const url = new URL(window.location.href);
      url.searchParams.set("farm", FARM);
      await navigator.clipboard.writeText(url.toString());
      alert("Link kopiert.");
    };

    // Paths
    const tasksCol = () => collection(db, "farms", FARM, "tasks");

    // Helpers
    function escapeHtml(str){
      return (str ?? "").toString()
        .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
        .replaceAll('"',"&quot;").replaceAll("'","&#039;");
    }

    // Calendar
    let calendar;
    function initCalendar(){
      calendar = new FullCalendar.Calendar(document.getElementById("cal"), {
        initialView: "dayGridMonth",
        height: "auto",
        headerToolbar: { left:"prev,next today", center:"title", right:"dayGridMonth,timeGridWeek,timeGridDay" },
        eventClick: (info) => {
          const t = tasks.find(x => x.id === info.event.id);
          if (!t) return;
          alert(
            "Titel: " + (t.title || "") + "\n" +
            "Datum: " + (t.date || "—") + "\n" +
            "Person: " + (t.worker || "—") + "\n" +
            "Ort: " + (t.place || "—") + "\n" +
            "Priorität: " + (t.prio || "—") + "\n\n" +
            "Infos:\n" + (t.info || "")
          );
        }
      });
      calendar.render();
    }

    function refreshCalendar(){
      if (!calendar) return;

      // WICHTIG: wirklich ALLE Events neu setzen
      calendar.removeAllEvents();

      for (const t of tasks){
        if (!t.date) continue; // nur Tasks mit Datum
        calendar.addEvent({
          id: t.id,
          title: t.title || "(Ohne Titel)",
          start: t.date,
          allDay: true
        });
      }
    }

    initCalendar();

    // Tasks (Live)
    let tasks = [];
    let unsub = null;

    function renderTasks(){
      const wrap = $("taskList");
      wrap.innerHTML = "";

      // Optional: Sortieren (falls createdAt fehlt, trotzdem stabil)
      const sorted = [...tasks].sort((a,b)=>{
        const ad = (a.date || "");
        const bd = (b.date || "");
        if (ad !== bd) return bd.localeCompare(ad); // neuere Datums zuerst
        const at = a._createdAtMs || 0;
        const bt = b._createdAtMs || 0;
        return bt - at;
      });

      for (const t of sorted){
        const div = document.createElement("div");
        div.className = "task" + (t.done ? " done" : "");
        div.innerHTML = `
          <b>${escapeHtml(t.title)}</b>
          <div class="meta">📅 ${escapeHtml(t.date || "—")} · 👤 ${escapeHtml(t.worker || "—")} · 📍 ${escapeHtml(t.place || "—")} · ⭐ ${escapeHtml(t.prio || "normal")}</div>
          <div class="meta">${escapeHtml(t.info || "")}</div>
          <div style="margin-top:8px;">
            <button class="ok" data-id="${t.id}">${t.done ? "Wieder offen" : "Erledigt"}</button>
            <button class="del" data-del="${t.id}">Löschen</button>
          </div>
        `;
        wrap.appendChild(div);
      }

      wrap.querySelectorAll("button.ok").forEach(b=>{
        b.onclick = async ()=> {
          const id = b.getAttribute("data-id");
          const t = tasks.find(x=>x.id===id);
          if (!t) return;
          await updateDoc(doc(db, "farms", FARM, "tasks", id), { done: !t.done });
        };
      });
      wrap.querySelectorAll("button.del").forEach(b=>{
        b.onclick = async ()=> {
          const id = b.getAttribute("data-del");
          await deleteDoc(doc(db, "farms", FARM, "tasks", id));
        };
      });

      // Kalender IMMER aktualisieren
      refreshCalendar();
    }

    function startListeners(){
      if (!FARM) return;
      if (unsub) unsub();

      // Falls createdAt fehlt, kann orderBy Probleme machen.
      // Darum: wir nehmen nur orderBy, wenn du createdAt konsequent setzt.
      // -> Du setzt createdAt beim Erstellen, also ist es ok.
      // Wenn du alte manuelle Einträge ohne createdAt hast, einfach löschen oder createdAt hinzufügen.
      const q = query(tasksCol(), orderBy("createdAt","desc"));

      unsub = onSnapshot(q, (snap)=>{
        tasks = snap.docs.map(d=>{
          const data = d.data();
          // createdAt als ms merken (falls vorhanden)
          const ms = data.createdAt?.toMillis ? data.createdAt.toMillis() : 0;
          return { id:d.id, ...data, _createdAtMs: ms };
        });
        renderTasks();
      }, (err)=>{
        alert("Fehler beim Laden der Aufträge: " + err.message);
      });
    }

    window.createTask = async () => {
      if (!FARM) return alert("Bitte zuerst Betriebscode laden.");
      const title = ($("tTitle").value || "").trim();
      if (!title) return alert("Titel fehlt.");

      await addDoc(tasksCol(), {
        title,
        date: $("tDate").value || "",
        worker: ($("tWorker").value || "").trim(),
        place: ($("tPlace").value || "").trim(),
        prio: $("tPrio").value || "normal",
        info: ($("tInfo").value || "").trim(),
        done: false,
        createdAt: serverTimestamp()
      });

      $("tTitle").value = "";
      $("tInfo").value = "";
    };

    // Boot
    const initialFarm = getFarmFromUrlOrStorage();
    if (initialFarm){
      $("farmId").value = initialFarm;
      FARM = initialFarm;
      startListeners();
    }
  </script>
</body>
</html>
